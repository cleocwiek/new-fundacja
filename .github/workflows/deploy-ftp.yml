# Uploads the website to the foundation's own server over FTP (encrypted with TLS), so every
# change merged into main (and every podcast update) goes live there too.
# Needs three repository secrets: FTP_SERVER, FTP_USERNAME, FTP_PASSWORD
# (Settings → Secrets and variables → Actions). Until they exist the job
# skips itself. Only changed files are uploaded; the action keeps a
# .ftp-deploy-sync-state.json file on the server to know what is there.
name: Wysyłka strony na serwer

on:
  push:
    branches: [main]
  workflow_run:
    workflows: ["Aktualizacja odcinków podcastu"]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: deploy-ftp
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Check secrets
        id: check
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
        run: |
          if [ -z "$FTP_SERVER" ]; then
            echo "::notice::FTP secrets are not set yet, skipping the upload."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.check.outputs.ready == 'true'
        with:
          ref: main

      # Copy only the files the website needs into _site.
      - name: Prepare website files
        if: steps.check.outputs.ready == 'true'
        run: |
          rsync -a ./ _site/ \
            --exclude '.git*' \
            --exclude '.github/' \
            --exclude 'content/' \
            --exclude 'podcast/' \
            --exclude '_site/' \
            --exclude '*.md' \
            --exclude '.DS_Store' \
            --exclude 'images/ archive1.png' \
            --exclude 'images/archive*.png' \
            --exclude 'images/kampania.png' \
            --exclude 'images/grupy*.png' \
            --exclude 'images/takecare.png' \
            --exclude 'images/plakat.png' \
            --exclude 'images/podcast.png' \
            --exclude 'images/offternoon.jpg' \
            --exclude 'images/mamtowgrupie-video.MP4' \
            --exclude 'images/kampania/Przewodnik*' \
            --exclude 'images/kampania/poster13.jpg'
          du -sh _site

      - name: Upload to server
        if: steps.check.outputs.ready == 'true'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./_site/
          server-dir: ./public_html/moznazwariowac.pl/
